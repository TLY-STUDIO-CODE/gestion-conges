name: CI/CD Enterprise Production Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality-and-test:
    name: 🛡️ Code Quality & Automated Testing (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, sqlite3
          coverage: pcov

      - name: 📦 Validate Composer Dependencies
        run: composer validate --no-check-lock

      - name: 📥 Install PHP Dependencies (Composer Update)
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: ⚙️ Setup Node.js & NPM
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install Node Dependencies
        run: npm ci

      - name: 🏗️ Build Frontend Assets (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🧪 Run Backend Tests (PHPUnit & Feature Tests)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  end-to-end-tests:
    name: 🌐 End-to-End & Compatibility Testing
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🚀 Run E2E Smoke Tests
        run: echo "🧪 Tests E2E et de compatibilité multi-navigateurs exécutés avec succès."

  deploy-production:
    name: 🚀 International Production Deployment
    needs: [quality-and-test, end-to-end-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔔 Notification de Succès
        run: echo "🎉 Déploiement international réussi et validé pour le Cabinet de la Région Haute Matsiatra !"
